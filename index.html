<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풀밭 시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Jua', 'Nunito', sans-serif; }
  svg { width: min(92vw, 78vh); height: auto; display: block; }
  .date { margin-top: 2vh; color: #5e5446; font-size: clamp(12px, 6vmin, 22px); letter-spacing: .02em; }
  .num { font-family: 'Jua', sans-serif; fill: #5e5446; font-size: 19px; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<svg viewBox="0 0 220 220" role="img" aria-label="서울 현재 시각">
  <defs>
    <radialGradient id="face" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f6fbec"/>
      <stop offset="65%" stop-color="#d9edc4"/>
      <stop offset="100%" stop-color="#b9d9a0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7aa85e" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- pink ring + face -->
  <circle cx="110" cy="110" r="100" fill="#f7d3db" stroke="#e9a9b8" stroke-width="2" filter="url(#soft)"/>
  <circle cx="110" cy="110" r="90" fill="url(#face)" stroke="#8ec46e" stroke-width="1.5"/>
  <!-- grass ticks near the bottom of the face -->
  <g stroke="#8ebf72" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M70 168l-2-7M74 168l2-8M78 168l4-6"/>
    <path d="M138 170l-3-6M142 170l1-8M146 170l4-6"/>
    <path d="M104 182l-2-6M108 182l1-7M112 182l3-6"/>
  </g>
  <!-- little flowers on the ring -->
  <g id="flowers"></g>
  <g id="ticks"></g>
  <g id="nums"></g>
  <!-- hands -->
  <g stroke-linecap="round">
    <line id="h" x1="110" y1="110" x2="110" y2="62" stroke="#5e5446" stroke-width="6"/>
    <line id="m" x1="110" y1="110" x2="110" y2="40" stroke="#5e5446" stroke-width="4"/>
    <line id="s" x1="110" y1="122" x2="110" y2="36" stroke="#f29bb0" stroke-width="2"/>
  </g>
  <circle cx="110" cy="110" r="6" fill="#ffd666" stroke="#5e5446" stroke-width="1.5"/>
</svg>
<div class="date" id="date"></div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  // numbers 1-12, rounded font
  const nums = document.getElementById('nums');
  for (let i = 1; i <= 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const t = el('text', { x: 110 + Math.cos(a) * 70, y: 111 + Math.sin(a) * 70, class: 'num' });
    t.textContent = i; nums.appendChild(t);
  }
  // minute dots
  const ticks = document.getElementById('ticks');
  for (let i = 0; i < 60; i++) {
    if (i % 5 === 0) continue;
    const a = (i * 6 - 90) * Math.PI / 180;
    ticks.appendChild(el('circle', { cx: 110 + Math.cos(a) * 84, cy: 110 + Math.sin(a) * 84, r: 1.1, fill: '#8ec46e' }));
  }
  // flowers on the pink ring at 12, 3, 6, 9 o'clock
  const fl = document.getElementById('flowers');
  const petals = ['#ffffff', '#ffecaa', '#ffffff', '#d6cef4'];
  [0, 90, 180, 270].forEach((deg, k) => {
    const a = (deg - 90) * Math.PI / 180, cx = 110 + Math.cos(a) * 95, cy = 110 + Math.sin(a) * 95;
    for (let p = 0; p < 5; p++) {
      const b = p * 72 * Math.PI / 180;
      fl.appendChild(el('circle', { cx: cx + Math.cos(b) * 3.4, cy: cy + Math.sin(b) * 3.4, r: 3, fill: petals[k], stroke: '#685e54', 'stroke-width': .6 }));
    }
    fl.appendChild(el('circle', { cx, cy, r: 1.9, fill: '#ffd666', stroke: '#685e54', 'stroke-width': .5 }));
  });
  // time in Seoul
  const fmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
  const dfmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long' });
  const rot = (id, deg) => document.getElementById(id).setAttribute('transform', `rotate(${deg} 110 110)`);
  function tick() {
    const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
    const h = +parts.hour % 12, m = +parts.minute, s = +parts.second;
    rot('h', h * 30 + m * 0.5); rot('m', m * 6 + s * 0.1); rot('s', s * 6);
    document.getElementById('date').textContent = dfmt.format(new Date());
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
